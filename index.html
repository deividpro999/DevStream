<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>DevStream</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>DevStream</h1>
    <p>Transforme seu estilo de avatar!</p>
  </header>

  <main>
    <section class="section">
      <h2>Bem-vindo ao DevStream</h2>
      <p>Personalize seu avatar com facilidade.</p>

      <!-- Avatar Preview com fundo dinâmico -->
      <div id="avatar-container">
        <div id="avatar-preview">
          <!-- Fundo colorido da pele -->
          <div id="avatar-skin"></div>
          <!-- Imagem por cima com transparência nas partes da pele -->
<img id="avatar-img" src="https://github.com/deividpro999/DevStream/blob/d4e89e6b782c4b644eb1a604048783f10719f66f/BASE%20DEVSTREAM.png" alt="Avatar">
        </div>

        <!-- Controles de Personalização -->
        <div id="avatar-controls">
          <label for="skin-color">Cor da Pele:</label>
          <input type="color" id="skin-color" value="#ffcc99">
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 DevStream. Todos os direitos reservados.</p>
  </footer>

  <script>
    // Atualiza cor da pele em tempo real
    document.getElementById('skin-color').addEventListener('input', function() {
      const skinColor = this.value;
      document.getElementById('avatar-skin').style.backgroundColor = skinColor;
    });
  </script>

</body>
</html>
